
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd ecommerce-frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: ecommerce-frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - ecommerce-frontend/node_modules/**/*
